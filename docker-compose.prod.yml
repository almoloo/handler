services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BASE_RPC_URL: ${BASE_RPC_URL}
      CHAIN_RPC_URL: ${CHAIN_RPC_URL}
      CHAIN_ID: ${CHAIN_ID}
      DEMO_TOKEN: ${DEMO_TOKEN}
      RILEY_SESSION_KEY: ${RILEY_SESSION_KEY}
      RILEY_PAYMENT_WEI: ${RILEY_PAYMENT_WEI}
      VILLAIN_SESSION_KEY: ${VILLAIN_SESSION_KEY}
      VILLAIN_PAYMENT_WEI: ${VILLAIN_PAYMENT_WEI}
      VILLAIN_TARGET_ADDRESS: ${VILLAIN_TARGET_ADDRESS}
      PORT: ${PORT}
      SESSION_SECRET: ${SESSION_SECRET}
      SIWE_DOMAIN: ${SIWE_DOMAIN}
      SIWE_CHAIN_ID: ${SIWE_CHAIN_ID}
      WEB_ORIGIN: ${WEB_ORIGIN}
    ports:
      - "3001:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:' + (process.env.PORT || 3000) + '/health', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
